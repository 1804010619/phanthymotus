# ActuCore — 执行模型层配置
#
# 与 perception/config.yaml 同构：mcp_port + 每张卡片的开关与参数。
# 当前不带任何卡片，plugins 为空。

mcp_port: 15730

plugins:
  vla:
    # enabled 只决定这张卡片**出不出现**在工具列表和侧边栏里，不决定它动不动。
    # 关掉的话 actucore 又变回一个空的 MCP host，画布上无从连起。
    #
    # 真正的门槛都在别处：
    #   1. 必须在画布上把它的输出连到一张驱动命令卡片（control/* 端口），
    #      否则 start 拿不到下游动作空间，直接拒绝；
    #   2. 协商不通过（动作维度、频率对不上）同样拒绝启动；
    #   3. 每一条指令还要过驱动侧 ControlSink 的检查链。
    # 容器重启也不会让它自己跑起来（bundle 的 start() 是空的）。
    enabled: true
    # provider 由 plugins/vla/providers/ 目录发现，不写死在这里。
    # 本地一个模型一个（按模型名），远端统一一个。
    #   mock       正弦轨迹，无模型、无网络、无 GPU —— 验证通路用
    #   smolvla    LeRobot SmolVLA，本机推理（只有 jp6.1 的镜像有）
    #   vla_cloud  任何跑在别处的模型，只配 endpoint + key + model
    provider: mock
    topic: /actucore/vla/cmd
    # 留空则取 min(模型 control_hz, 下游 expected_hz)，再被下游 max_hz 夹住。
    rate_hz: null
    # 指令流的优先级。遥控器一类应当高于策略，驱动侧 ControlSink 据此仲裁。
    priority: 50
    # ACP 物理通道，决定这张卡片和谁互斥。只是**协商之前**的占位：
    # start 之后以下游 descriptor 的 groups 为准（天轶是 arm_l/arm_r/hand_l/hand_r），
    # agent-core 在心跳时会重新读 schema，拿到真实的那一组。
    resource: arm

    # ── provider: mock ───────────────────────────────────────────────────
    # 正弦幅度是各关节半行程的比例，默认很小。
    amplitude: 0.05
    period_s: 8.0
    chunk_size: 10

    # ── provider: vla_cloud（远端）────────────────────────────────────────
    # 和 agent-core 配 LLM 是同一个形状：地址 + key + 模型名，没有别的。
    # 注意它说的是我们自己的 motus.vla/1 协议，不是 openpi 的 WebSocket 或
    # LeRobot 的 gRPC —— 翻译在服务端（phanthymotus-cloud）做，机器人这侧
    # 不背每种服务器一个适配器。
    endpoint: ""
    api_key: ""
    model: ""
    # 每次请求的超时。**必须短于下游驱动的 watchdog**，否则迟到的 chunk 会在
    # 机械臂已经被命令保持之后才到。
    timeout_ms: 200

    # ── provider: smolvla（本机）──────────────────────────────────────────
    # 需要镜像带 lerobot，即 jp6.1 的 jetson-base-actucore。jp5.11 上会在
    # start 时明确拒绝并说明原因（CUDA 11.4 撑不住 torch >= 2.2.1）。
    model_dir: /models/vla/smolvla
    device: cuda
    # 权重清单。COS 是机器人侧唯一来源，size + sha256 都要 pin。
    # 留空时：model_dir 里已有 checkpoint 就直接用，没有就明确报错 ——
    # 给一个没人上传过的文件编哈希，或者不校验就下载一个要驱动电机的东西，
    # 两者都不比一条清楚的错误强。上游优先 ModelScope（lerobot/smolvla_base）。
    weights: {}
    #   base_url: https://<bucket>.cos.<region>.myqcloud.com/public/smolvla_base
    #   files:
    #     config.json:            {size: 0, sha256: ""}
    #     model.safetensors:      {size: 0, sha256: ""}
    # checkpoint 的输入 key 跟着它的训练数据集走（有的叫 observation.images.top，
    # 有的叫 cam_high），所以这里是配置而不是约定：猜错的结果是策略对着一张黑图
    # 推理，而不是报错。
    feature_map: {}
    #   main:  observation.images.top
    #   state: observation.state

  # nav:
  #   enabled: true
  #   map_dir: /models/maps
  #
  # 卡片名要和 main.py 里 ActuCoreBundle 的注册块、以及插件的 PREFIX 对上。
