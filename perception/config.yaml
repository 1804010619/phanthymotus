mcp_port: 15720

plugins:
  asr:
    enabled: true
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en | sensevoice-small
    model_dir: /models/sherpa-onnx/asr
    # auto | cuda | cpu — auto picks cuda only when the image installed the CUDA
    # sherpa-onnx wheel (jetson jp5.11) AND the model's weights are fp32. Every
    # ASR/KWS bundle here is int8, and ONNX Runtime's CUDA provider has no int8
    # kernels — it falls back per node, which measured 3.3x SLOWER than CPU at the
    # same num_threads on an Orin NX. So this resolves to cpu today. Numbers and
    # method in utils/onnx_provider.py.
    hw_provider: auto
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx | silero (same silero_vad.onnx, via sherpa-onnx) | webrtc
      threshold: 0.5
      silence_ms: 400
      pre_roll_ms: 500
    kws:
      enabled: true
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: true
    engine: vits2_trt
    backend: trt
    model_dir: /models/vits2
    speaker_id: 0
    speed: 1.0
    warmup: true
    max_chunk_tokens: 256
    # sherpa_onnx engine only — vits2_trt runs on TensorRT and ignores this.
    # Matcha's weights are fp32, so auto resolves to cuda on jp5.11 (measured
    # 4.3x faster than CPU at num_threads=2, 2.8x at each side's best).
    hw_provider: auto

  vop:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  ocr:
    enabled: true
    provider: rapidocr
    model_dir: /models/ocr/ppocrv6-small-trt
    device_id: 0
    language: zh
    use_angle_cls: true
    max_side_len: 1600
    det_unclip_ratio: 0.7
    det_thresh: 0.3
    det_box_thresh: 0.5
    rec_min_score: 0.9
    crop_refinement:
      enabled: true
      min_score: 0.9
      min_gain: 0.12
      min_text_length: 2
      profiles: [prefix_65, upper_center, upper_tight]
    empty_result_retry:
      enabled: true
      det_thresh: 0.1
      det_box_thresh: 0.1
    min_interval_ms: 0
